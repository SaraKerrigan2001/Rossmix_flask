# ============================================================
# Rossmix Flask — Docker Compose
# Uso:
#   Desarrollo:   docker compose up
#   Producción:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:

  # ── Base de datos PostgreSQL ────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rossmix_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-Rossmix}
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Ejecutar el SQL inicial al crear el contenedor por primera vez
      - ./scripts/database/Rossmix.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "${DB_PORT_EXPOSED:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-Rossmix}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - rossmix_net

  # ── Aplicación Flask (Gunicorn) ─────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rossmix_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      # Sobreescribir el host de BD para que apunte al servicio interno
      DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-Rossmix}
      FLASK_ENV:    ${FLASK_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # En desarrollo, montar el código para hot-reload
      # En producción comentar este volumen
      - .:/app
    networks:
      - rossmix_net

  # ── Seed de usuarios de prueba (corre una sola vez) ─────────
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rossmix_seed
    command: python scripts/utilidades/crear_usuarios.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-Rossmix}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    restart: "no"
    networks:
      - rossmix_net
    profiles:
      - seed   # Solo corre con: docker compose --profile seed up seed

# ── Volúmenes persistentes ──────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Red interna ─────────────────────────────────────────────
networks:
  rossmix_net:
    driver: bridge
